<ion-content>
  <div class="modal-card">
    <div class="modal-header">
      <h2>{{ 'orderNote.title' | translate }}</h2>

      <button class="close-btn" type="button" (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <form [formGroup]="form" class="form">
      <div class="form-field">
        <label>{{ 'orderNote.label' | translate }}</label>

        <textarea
          formControlName="note"
          [placeholder]="'orderNote.placeholder' | translate"
        ></textarea>

        <small>
          {{ form.controls.note.value.length }}/500 {{ 'orderNote.characters' | translate }}
        </small>
      </div>

      @if (hasMaxLengthError()) {
        <div class="error-message">
          {{ 'orderNote.errors.maxLength' | translate }}
        </div>
      }

      <ion-button expand="block" class="save-btn" (click)="save()">
        {{ 'common.save' | translate }}
      </ion-button>

      @if (form.controls.note.value) {
        <ion-button expand="block" fill="clear" color="medium" (click)="clear()">
          {{ 'orderNote.clear' | translate }}
        </ion-button>
      }
    </form>
  </div>
</ion-content>
